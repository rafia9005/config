backend = "glx";
vsync = true;

corner-radius = 5;
rounded-corners = true;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'tooltip'",
  "window_type = 'utility'",
  "class_g = 'Polybar'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

blur-method = "dual_kawase";
blur-strength = 8;

inactive-opacity = 0.99;
active-opacity = 1.0;

opacity-rule = [
  "100: _NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "100: window_type = 'popup_menu'",
  "100: window_type = 'dropdown_menu'",
  "100: window_type = 'tooltip'",
  "82:class_g = 'Alacritty'",
  "82:class_g = 'kitty'",
  "82:class_g = 'st-256color'"
];

blur-background-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'tooltip'",
  "window_type = 'utility'",
  "_GTK_FRAME_EXTENTS@:c"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  popup_menu = { shadow = false; blur-background = false; opacity = 1.0; animations = false; };
  dropdown_menu = { shadow = false; blur-background = false; opacity = 1.0; animations = false; };
  utility = { shadow = false; blur-background = false; opacity = 1.0; };
};

animations = (
  {
    triggers = ["size"];
    scale-x = {
      curve = "cubic-bezier(0.175, 0.885, 0.32, 1.275)";
      start = "window-width-before / window-width";
      end = 1;
      duration = 0.2;
    };
    scale-y = {
      curve = "cubic-bezier(0.175, 0.885, 0.32, 1.275)";
      start = "window-height-before / window-height";
      end = 1;
      duration = 0.2;
    };
    offset-x = {
      curve = "cubic-bezier(0.175, 0.885, 0.32, 1.275)";
      start = "window-x-before - window-x";
      duration = 0.2;
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.175, 0.885, 0.32, 1.2)";
      start = "window-y-before - window-y";
      duration = 0.2;
      end = 0;
    };
    shadow-scale-y = "scale-y";
    shadow-scale-x = "scale-x";
  }
)

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

